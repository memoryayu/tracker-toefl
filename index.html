<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Belajar TOEFL ITP</title>
<meta name="theme-color" content="#2A3AA0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TOEFL ITP">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
:root{--ft:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--bg:#F5F0E4;--surf:#FFFDF8;--ink:#1D2140;--mut:#7A768B;--line:#E6DDC8;--p:#3347B8;--p2:#5C70E0;--pc:#E4E8FB;--acc:#EE8A3E;--accc:#FDEBD9;--ok:#2F9E6E;--onp:#fff;--h0:#EAE2CE;--h1:#C9D2F6;--h2:#97A8EE;--h3:#6B80E4;--h4:#3347B8;--hero1:#2A3AA0;--hero2:#5A6EE0;--sh:0 1px 2px rgba(29,33,64,.08),0 6px 18px rgba(29,33,64,.06);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1226;--surf:#191D38;--ink:#ECE8DB;--mut:#9C98B0;--line:#2B3050;--p:#9DB0FF;--p2:#7D92F0;--pc:#252C58;--acc:#FFA45E;--accc:#3A2A22;--ok:#5CD0A0;--onp:#0F1226;--h0:#232846;--h1:#2F3A78;--h2:#4558B8;--h3:#6A80E8;--h4:#A5B6FF;--hero2:#4757C8;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1226;--surf:#191D38;--ink:#ECE8DB;--mut:#9C98B0;--line:#2B3050;--p:#9DB0FF;--p2:#7D92F0;--pc:#252C58;--acc:#FFA45E;--accc:#3A2A22;--ok:#5CD0A0;--onp:#0F1226;--h0:#232846;--h1:#2F3A78;--h2:#4558B8;--h3:#6A80E8;--h4:#A5B6FF;--hero2:#4757C8;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--ft);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:20px 16px 110px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.top .tt{flex:1;min-width:0}
.top h1{font:700 28px/1.15 var(--ft);letter-spacing:-.02em;margin:0}
.top p{margin:2px 0 0;font-size:13px;color:var(--mut)}
.ib{min-width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--surf);box-shadow:var(--sh);font-size:13px;font-weight:500}
.ib svg{width:20px;height:20px}
.stack{display:grid;gap:14px}
.card{background:var(--surf);border-radius:22px;padding:16px;box-shadow:var(--sh)}
h3{font:600 17px/1.2 var(--ft);margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mut{color:var(--mut);font-size:13px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dy{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;border-radius:16px;font-size:12px;color:var(--mut)}
.dy b{font-size:16px;color:var(--ink);font-weight:500}
.dy i{display:block;width:8px;height:8px;border-radius:50%;background:var(--h0)}
.dy.on{background:var(--p);color:var(--onp)}
.dy.on b{color:var(--onp)}
.dy.td:not(.on){box-shadow:inset 0 0 0 1.5px var(--p2)}
.dy[data-l="4"] i{background:var(--ok)}
.dy[data-l="1"] i,.dy[data-l="2"] i,.dy[data-l="3"] i{background:var(--acc)}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;display:flex;gap:16px;align-items:center}
.hero .rg{position:relative;flex:none;width:92px;height:92px}
.hero .rg span{position:absolute;inset:0;display:grid;place-items:center;font:600 22px var(--ft)}
.hero small{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.hero b{display:block;font:600 20px/1.2 var(--ft);margin:2px 0 4px}
.hero p{margin:0;font-size:13px;opacity:.85}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st{background:var(--surf);border-radius:18px;padding:12px;box-shadow:var(--sh)}
.st b{display:block;font:600 22px/1.1 var(--ft);color:var(--p)}
.st.fire b{color:var(--acc)}
.st span{font-size:12px;color:var(--mut)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 2px}
.prog i{display:block;height:100%;background:var(--p2);border-radius:3px;transition:width .25s}
.task{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.task:last-of-type{border-bottom:0}
.task input{position:absolute;opacity:0;width:1px;height:1px}
.tl{flex:none;width:40px;height:40px;border-radius:13px;background:var(--pc);color:var(--p);display:grid;place-items:center;font-weight:700;font-size:15px}
.task:nth-of-type(2) .tl{background:var(--accc);color:var(--acc)}
.task .x{flex:1;min-width:0}
.task b{display:block;font-weight:500}
.task small{color:var(--mut);font-size:13px}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--onp);transition:all .15s}
.ck svg{width:14px;height:14px;opacity:0}
.task input:checked~.ck{background:var(--ok);border-color:var(--ok)}
.task input:checked~.ck svg{opacity:1}
.task input:checked~.x b{color:var(--mut);text-decoration:line-through}
.task input:focus-visible~.ck{outline:2px solid var(--p2);outline-offset:3px}
.ok{margin:8px 0 0;color:var(--ok);font-weight:500;font-size:14px}
label.f{display:block;font-size:13px;font-weight:500;color:var(--p);margin:14px 0 4px}
textarea,input[type=number],input[type=date]{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
.sv{font-size:12px;color:var(--mut);text-align:right;min-height:16px;margin-top:6px}
.ringw{position:relative;width:250px;height:250px;margin:6px auto 0}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
#tmBig{font:300 50px var(--ft);letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--p)}
.fab{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto 4px;height:54px;padding:0 30px;border-radius:27px;background:var(--p);color:var(--onp);font-weight:500;box-shadow:0 6px 16px rgba(51,71,184,.3)}
.fab svg{width:22px;height:22px}
.fab.run{background:var(--acc)}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut)}
.bars i{display:block;width:100%;max-width:30px;background:var(--h2);border-radius:8px 8px 3px 3px;min-height:3px;margin:3px 0}
.bars div.t i{background:var(--p)}
.wk{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.wk:last-child{border-bottom:0}
.wk .n{flex:none;width:30px;height:30px;border-radius:10px;background:var(--pc);color:var(--p);display:grid;place-items:center;font-weight:700;font-size:13px}
.wk.cur .n{background:var(--p);color:var(--onp)}
.wk .x{flex:1;min-width:0}
.wk b{display:block;font-weight:500;font-size:14px;line-height:1.25}
.cells{display:grid;grid-template-columns:repeat(7,18px);gap:4px}
.cells button{width:18px;height:18px;border-radius:6px;background:var(--h0)}
.cells [data-l="1"]{background:var(--h1)}.cells [data-l="2"]{background:var(--h2)}.cells [data-l="3"]{background:var(--h3)}.cells [data-l="4"]{background:var(--h4)}
.cells .td{box-shadow:0 0 0 2px var(--acc)}
.pct{font-size:12px;color:var(--mut);width:34px;text-align:right}
.cd{display:flex;align-items:center;gap:14px}
.cd .big{flex:none;min-width:78px;text-align:center;font:700 26px var(--ft);color:var(--acc);background:var(--accc);border-radius:16px;padding:10px 8px}
.cd b{display:block;font-weight:600}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pb{display:grid;grid-template-columns:76px 1fr 30px 34px;gap:8px;align-items:center;padding:6px 0;font-size:14px}
.pb .tr{position:relative;height:10px;background:var(--h0);border-radius:5px}
.pb .tr i{display:block;height:100%;background:var(--p2);border-radius:5px}
.pb u{position:absolute;top:-4px;width:2px;height:18px;background:var(--acc)}
.pb b{text-align:right;font-weight:500}
.pb em{font-style:normal;font-size:12px;color:var(--mut)}
.btn.sm{margin:0;padding:8px 16px;display:inline-block}
.btn{border:1px solid var(--p2);color:var(--p);border-radius:20px;padding:9px 18px;font-weight:500;margin-top:14px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--surf);display:flex;padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(29,33,64,.1);border-radius:24px 24px 0 0;z-index:9}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500;color:var(--mut)}
.nav .pl{width:60px;height:30px;border-radius:15px;display:grid;place-items:center}
.nav svg{width:22px;height:22px}
.nav [aria-current="page"]{color:var(--p)}
.nav [aria-current="page"] .pl{background:var(--pc)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="tt"><h1 id="ttl">Belajar TOEFL ITP</h1><p id="sub"></p></div><div id="act" style="display:flex;gap:8px"></div></header>
  <main class="stack" id="main"></main>
</div>
<nav class="nav" aria-label="Menu utama">
  <button data-v="today"><span class="pl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/></svg></span>Hari ini</button>
  <button data-v="timer"><span class="pl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7"/><path d="M12 10v4l2.5 1.5M9.5 3h5"/></svg></span>Timer</button>
  <button data-v="progress"><span class="pl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg></span>Progres</button>
</nav>
<script>
const WEEKS=[
 {t:"Diagnostik & dasar",f:"tes ITP penuh dan present simple",p:"fondasi"},
 {t:"Tenses dasar",f:"tenses dan singular/jamak",p:"fondasi"},
 {t:"Modal & bentuk verb",f:"modal, future, make/let",p:"grammar inti"},
 {t:"Pola verb & klausa",f:"preposisi + V-ing dan klausa",p:"grammar inti"},
 {t:"Listening & Reading",f:"Listening, Reading, Structure lanjutan",p:"skill tes"},
 {t:"Perbaiki titik lemah",f:"bagian dengan skor terendah",p:"skill tes"},
 {t:"Simulasi tes",f:"simulasi tes penuh",p:"simulasi"},
 {t:"Finalisasi & hari tes",f:"review ringan dan persiapan tes",p:"simulasi"}];
const KEY="toefl-itp-tracker-v1",C=2*Math.PI*104;
const ICO={ck:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.5"/></svg>',
 l:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 r:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
 pl:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 001.5.9l10-6.5a1 1 0 000-1.8l-10-6.5A1 1 0 008 5.5z"/></svg>',
 pa:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.5" height="14" rx="1.2"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2"/></svg>'};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const T=()=>iso(new Date());
const fmt=s=>parse(s).toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"});
const p2=n=>String(n).padStart(2,"0");
const hms=s=>{s=Math.floor(s);return p2(Math.floor(s/3600))+":"+p2(Math.floor(s%3600/60))+":"+p2(s%60)};
const hm=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+" j "+m+" m":m+" m"};
let S={start:T(),days:{},goal:2,testDate:"",target:520,tm:{run:false,since:0}},cur=T(),view="today",ref=null,tm=null,arm=false;
try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.days)S=Object.assign(S,o)}}catch(e){}
if(!S.tm)S.tm={run:false,since:0};
const day=d=>S.days[d]||(S.days[d]={t:[0,0,0,0],note:"",err:"",score:"",sec:0});
const tasks=w=>[["Aa","Anki: 10 kata baru","10 menit"],["✎","Latihan soal: "+WEEKS[w].f,"30–40 menit"],["♪","Listening","20 menit, dengar dulu lalu cek transkrip"],["↺","Review buku kesalahan","10–15 menit"]];
const lv=d=>S.days[d]?S.days[d].t.filter(Boolean).length:0;
const isFull=d=>lv(d)===4;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  const el=document.getElementById("sv");if(el)el.textContent="Tersimpan otomatis";
  if(ref){clearTimeout(tm);tm=setTimeout(()=>{ref.set({json:JSON.stringify(S)}).catch(()=>{})},700)}
}
function streak(){let d=isFull(T())?T():addDays(T(),-1),n=0;while(isFull(d)){n++;d=addDays(d,-1)}return n}
function weekPct(w){let n=0;for(let i=0;i<7;i++)n+=lv(addDays(S.start,w*7+i));return Math.round(n/28*100)}
function commit(){const t=S.tm;if(!t.run)return false;let ch=false;const now=Date.now();
  for(;;){const sd=new Date(t.since),end=new Date(sd.getFullYear(),sd.getMonth(),sd.getDate()+1).getTime();
    if(now>=end){const k=iso(sd);day(k).sec=(day(k).sec||0)+(end-t.since)/1000;t.since=end;ch=true}else break}
  return ch}
const secOf=d=>{const b=(S.days[d]&&S.days[d].sec)||0;return d===T()&&S.tm.run?b+(Date.now()-S.tm.since)/1000:b};
function toggle(){commit();const t=S.tm;
  if(t.run){const k=iso(new Date(t.since));day(k).sec=(day(k).sec||0)+(Date.now()-t.since)/1000;t.run=false}
  else{t.run=true;t.since=Date.now()}
  save();render()}
function tick(){
  if(commit())save();
  const g=id=>document.getElementById(id),s=secOf(T());
  if(g("tmBig")){g("tmBig").textContent=hms(s);g("ring").style.strokeDashoffset=C*(1-Math.min(1,s/((S.goal||2)*3600)));g("tmSub").textContent="dari target "+(S.goal||2)+" jam"}
  if(g("chipSec")&&cur===T())g("chipSec").textContent=hm(s)}
function ring(p,sz,sw,col,bg){const r=(sz-sw)/2,c=2*Math.PI*r;
  return `<svg viewBox="0 0 ${sz} ${sz}" width="${sz}" height="${sz}" style="transform:rotate(-90deg)"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${bg}" stroke-width="${sw}"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/></svg>`}
function chart(sc){
  const tg=S.target||520,v=sc.map(e=>Number(e[1].score)),lo=Math.min(450,Math.min(...v,tg)-20),hi=Math.max(560,Math.max(...v,tg)+20),W=300,H=120,X=i=>sc.length>1?20+i*(W-40)/(sc.length-1):W/2,Y=n=>H-12-(n-lo)/(hi-lo)*(H-28);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><line x1="0" x2="${W}" y1="${Y(tg)}" y2="${Y(tg)}" stroke="var(--acc)" stroke-dasharray="4 4"/><text x="${W-2}" y="${Y(tg)-4}" text-anchor="end" font-size="10" fill="var(--acc)">Target ${tg}</text><polyline fill="none" stroke="var(--p2)" stroke-width="2.5" stroke-linejoin="round" points="${v.map((n,i)=>X(i)+","+Y(n)).join(" ")}"/>${v.map((n,i)=>`<circle cx="${X(i)}" cy="${Y(n)}" r="4" fill="var(--p)"/><text x="${X(i)}" y="${Y(n)-9}" text-anchor="middle" font-size="10" fill="var(--ink)">${n}</text>`).join("")}</svg>`}
async function exportData(){commit();
  const name="toefl-itp-cadangan-"+T()+".json",txt=JSON.stringify(S,null,1),m=document.getElementById("bk");
  try{const f=new File([txt],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});if(m)m.textContent="Cadangan dibagikan.";return}}catch(e){if(e&&e.name==="AbortError")return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);if(m)m.textContent="Cadangan diunduh."}catch(e){if(m)m.textContent="Gagal mengekspor."}}
function nav(){document.querySelectorAll(".nav button").forEach(b=>{if(b.dataset.v===view)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")})}
function render(){
  const idx=diff(cur,S.start),inPlan=idx>=0&&idx<56,w=Math.min(7,Math.max(0,Math.floor(idx/7))),W=WEEKS[w];
  const M=document.getElementById("main"),act=document.getElementById("act");let h="";
  if(view==="today"){
    const d=day(cur),done=lv(cur),tot=Object.keys(S.days).filter(isFull).length,ws=inPlan?addDays(S.start,w*7):addDays(cur,-3);
    document.getElementById("ttl").textContent=fmt(cur);
    document.getElementById("sub").textContent=inPlan?"Minggu "+(w+1)+" dari 8 · hari ke-"+(idx+1):(idx<0?"Belum masuk jadwal belajar":"Jadwal 8 minggu sudah lewat");
    act.innerHTML=(cur!==T()?'<button class="ib" data-a="today" aria-label="Ke hari ini" style="padding:0 14px">Hari ini</button>':"")+'<button class="ib" data-a="prev" aria-label="Hari sebelumnya">'+ICO.l+'</button><button class="ib" data-a="next" aria-label="Hari berikutnya">'+ICO.r+'</button>';
    const sc0=Object.entries(S.days).filter(e=>e[1].score!==""&&!isNaN(Number(e[1].score))).sort((a,b)=>a[0]<b[0]?-1:1),last=sc0.length?Number(sc0[sc0.length-1][1].score):null,tg=S.target||520,n=/^\d{4}-\d{2}-\d{2}$/.test(S.testDate||"")?diff(S.testDate,T()):null;
    const cd=`<div class="card cd"><div class="big">${n===null?"–":n>0?"H-"+n:n===0?"Hari H":"Lewat"}</div><div><b>${n===null?"Atur tanggal tes":"Menuju tes "+parse(S.testDate).toLocaleDateString("id-ID",{day:"numeric",month:"long"})}</b><span class="mut">Target ${tg}${last!==null?" · skor terakhir "+last+(last>=tg?" (tercapai)":" (kurang "+(tg-last)+")"):""}${n===null?" · di Progres › Pengaturan":""}</span></div></div>`;
    h=`<div class="strip">${[...Array(7)].map((_,i)=>{const k=addDays(ws,i);return `<button class="dy ${k===cur?"on":""} ${k===T()?"td":""}" data-d="${k}" data-l="${lv(k)}"><span>${parse(k).toLocaleDateString("id-ID",{weekday:"short"})}</span><b>${parse(k).getDate()}</b><i></i></button>`}).join("")}</div>
    ${cd}
    <div class="card hero"><div class="rg">${ring(done/4,92,9,"#fff","rgba(255,255,255,.25)")}<span>${done}/4</span></div><div><small>Fase ${W.p}</small><b>${W.t}</b><p>Fokus: ${W.f}.</p></div></div>
    <div class="chips"><div class="st fire"><b>${streak()}</b><span>hari beruntun</span></div><div class="st"><b>${tot}</b><span>hari penuh</span></div><div class="st"><b id="chipSec">${hm(secOf(cur))}</b><span>waktu belajar</span></div></div>
    <div class="card"><div class="row"><h3>Tugas hari ini</h3><span class="mut">${done} dari 4</span></div><div class="prog"><i style="width:${done*25}%"></i></div>
    ${tasks(w).map((t,i)=>`<label class="task"><input type="checkbox" data-i="${i}" ${d.t[i]?"checked":""}><span class="tl">${t[0]}</span><span class="x"><b>${t[1]}</b><small>${t[2]}</small></span><span class="ck">${ICO.ck}</span></label>`).join("")}
    ${done===4?'<p class="ok">Semua tugas hari ini selesai. Istirahat yang cukup.</p>':""}</div>
    <div class="card"><h3>Catatan hari ini</h3>
    <label class="f" for="note">Capaianku</label><textarea id="note" placeholder="Apa yang sudah kupahami hari ini?"></textarea>
    <label class="f" for="err">Buku kesalahan</label><textarea id="err" placeholder="Salah, benar, lalu aturannya"></textarea>
    <label class="f">Skor per bagian (kalau hari ini tes)</label><div class="tri"><input id="sl" type="number" min="31" max="68" placeholder="Listening" aria-label="Skor Listening"><input id="ss" type="number" min="31" max="68" placeholder="Structure" aria-label="Skor Structure"><input id="sr" type="number" min="31" max="68" placeholder="Reading" aria-label="Skor Reading"></div><label class="f" for="score">Skor total</label><input id="score" type="number" min="310" max="677" placeholder="310–677"><p class="mut" style="margin:4px 0 0">Terisi otomatis dari tiga bagian (31–68 per bagian).</p><div class="sv" id="sv"></div></div>`;
  }else if(view==="timer"){
    document.getElementById("ttl").textContent="Timer belajar";document.getElementById("sub").textContent="Reset otomatis tiap pukul 00.00";act.innerHTML="";
    const run=S.tm.run,s=secOf(T()),days=[...Array(7)].map((_,i)=>addDays(T(),i-6)),vals=days.map(secOf),mx=Math.max((S.goal||2)*3600,...vals);
    h=`<div class="card" style="text-align:center"><div class="ringw"><svg viewBox="0 0 250 250"><circle cx="125" cy="125" r="104" fill="none" stroke="var(--h0)" stroke-width="14"/><circle id="ring" cx="125" cy="125" r="104" fill="none" stroke="var(--p2)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(1,s/((S.goal||2)*3600)))}"/></svg>
    <div class="c"><span class="mut">${run?"Sedang belajar":(s>0?"Dijeda":"Siap belajar")}</span><span id="tmBig">${hms(s)}</span><span class="mut" id="tmSub">dari target ${S.goal||2} jam</span></div></div>
    <button class="fab ${run?"run":""}" data-a="toggle">${run?ICO.pa+"Jeda":ICO.pl+(s>0?"Lanjut belajar":"Mulai belajar")}</button>
    <p class="mut" style="margin:6px 0 0">Total hari ini bertambah selama timer jalan, dan tetap jalan walau halaman ditutup.</p></div>
    <div class="card"><h3>7 hari terakhir</h3><div class="bars">${days.map((d,i)=>`<div class="${i===6?"t":""}"><span>${hm(vals[i]).replace(" j ","j")}</span><i style="height:${Math.round(vals[i]/mx*80)}px"></i><span>${parse(d).toLocaleDateString("id-ID",{weekday:"short"})}</span></div>`).join("")}</div></div>`;
  }else{
    document.getElementById("ttl").textContent="Progres";document.getElementById("sub").textContent="Peta 8 minggu, ketuk kotak untuk membuka harinya";act.innerHTML="";
    const scores=Object.entries(S.days).filter(e=>e[1].score!=="").sort((a,b)=>a[0]<b[0]?-1:1),tot=Object.values(S.days).reduce((a,x)=>a+(x.sec||0),0);
    const full=scores.filter(e=>{const q=e[1].sc;return q&&[q.l,q.s,q.r].every(x=>x!==""&&Number(x)>=31&&Number(x)<=68)});let prof="";
    if(full.length){const lt=full[full.length-1],q=lt[1].sc,pv=full.length>1?full[full.length-2][1].sc:null,tgs=(S.target||520)/10,it=[["Listening","l"],["Structure","s"],["Reading","r"]],mn=it.reduce((a,b)=>Number(q[b[1]])<Number(q[a[1]])?b:a);
      prof=`<div class="card"><h3>Profil bagian</h3><p class="mut" style="margin:2px 0 8px">Tes ${parse(lt[0]).toLocaleDateString("id-ID",{day:"numeric",month:"long"})}. Garis oranye = rata-rata per bagian yang dibutuhkan untuk target ${S.target||520}.</p>${it.map(x=>{const v=Number(q[x[1]]),df=pv&&pv[x[1]]!==""?v-Number(pv[x[1]]):null;return `<div class="pb"><span>${x[0]}</span><div class="tr"><i style="width:${(v-31)/37*100}%"></i><u style="left:${Math.min(100,Math.max(0,(tgs-31)/37*100))}%"></u></div><b>${v}</b><em>${df===null?"":(df>0?"+":"")+df}</em></div>`}).join("")}<p class="ok">${Number(q[mn[1]])>=tgs?"Semua bagian sudah di atas rata-rata target.":"Prioritaskan "+mn[0]+"."}</p></div>`}
    h=`<div class="chips"><div class="st fire"><b>${streak()}</b><span>hari beruntun</span></div><div class="st"><b>${Object.keys(S.days).filter(isFull).length}</b><span>hari penuh</span></div><div class="st"><b>${hm(tot)}</b><span>total belajar</span></div></div>
    <div class="card"><h3>Peta 8 minggu</h3>${WEEKS.map((x,i)=>`<div class="wk ${i===w&&inPlan?"cur":""}"><span class="n">${i+1}</span><span class="x"><b>${x.t}</b><span class="mut">Fase ${x.p}</span></span><span class="cells">${[...Array(7)].map((_,j)=>{const k=addDays(S.start,i*7+j);return `<button data-d="${k}" data-l="${lv(k)}" class="${k===T()?"td":""}" aria-label="${fmt(k)}"></button>`}).join("")}</span><span class="pct">${weekPct(i)}%</span></div>`).join("")}</div>`+
    prof+(scores.length?`<div class="card"><h3>Riwayat skor</h3>${chart(scores)}<p class="mut" style="margin:6px 0 0">Batas minimal LPDP 500. Targetkan 520 ke atas.</p></div>`:"")+
    `<div class="card"><h3>Pengaturan</h3><label class="f" for="start">Tanggal mulai minggu 1</label><input id="start" type="date" value="${S.start}">
    <label class="f" for="goal">Target belajar per hari (jam)</label><input id="goal" type="number" min="0.5" max="12" step="0.5" value="${S.goal||2}">
    <label class="f" for="tdate">Tanggal tes</label><input id="tdate" type="date" value="${S.testDate||""}">
    <label class="f" for="tgt">Target skor total</label><input id="tgt" type="number" min="310" max="677" value="${S.target||520}">
    <label class="f">Cadangan data</label><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-a="export">Ekspor</button><label class="btn sm" for="imp" style="cursor:pointer">Impor</label><input id="imp" type="file" accept="application/json,.json" style="position:absolute;opacity:0;width:1px;height:1px"></div><div class="sv" id="bk" style="text-align:left"></div>
    <button class="btn" data-a="reset">${arm?"Klik sekali lagi untuk menghapus":"Hapus semua data"}</button></div>`;
  }
  M.innerHTML=h;
  if(view==="today"){const d=day(cur);document.getElementById("note").value=d.note;document.getElementById("err").value=d.err;document.getElementById("score").value=d.score;const q=d.sc||{};document.getElementById("sl").value=q.l||"";document.getElementById("ss").value=q.s||"";document.getElementById("sr").value=q.r||""}
  nav();
}
document.addEventListener("click",e=>{
  const v=e.target.closest("[data-v]");if(v){view=v.dataset.v;arm=false;render();window.scrollTo(0,0);return}
  const dd=e.target.closest("[data-d]");if(dd){cur=dd.dataset.d;view="today";render();window.scrollTo(0,0);return}
  const b=e.target.closest("[data-a]");
  if(b){const a=b.dataset.a;
    if(a==="prev")cur=addDays(cur,-1);else if(a==="next")cur=addDays(cur,1);else if(a==="today")cur=T();
    else if(a==="toggle"){toggle();return}
    else if(a==="export"){exportData();return}
    else if(a==="reset"){if(!arm){arm=true;render();return}S={start:T(),days:{},goal:S.goal||2,tm:{run:false,since:0}};cur=T();arm=false;save()}
    if(a!=="reset")arm=false;render()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.i!==undefined){day(cur).t[Number(t.dataset.i)]=t.checked?1:0;save();render()}
  else if(t.id==="start"&&t.value){S.start=t.value;save()}
  else if(t.id==="goal"&&Number(t.value)>0){S.goal=Number(t.value);save()}
  else if(t.id==="tdate"){S.testDate=t.value;save()}
  else if(t.id==="tgt"&&Number(t.value)>=310){S.target=Number(t.value);save()}
  else if(t.id==="imp"&&t.files&&t.files[0]){const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||typeof o.days!=="object")throw 0;S=Object.assign({start:T(),days:{},goal:2,testDate:"",target:520},o,{tm:{run:false,since:0}});save();render();const b=document.getElementById("bk");if(b)b.textContent="Cadangan dipulihkan."}catch(x){const b=document.getElementById("bk");if(b)b.textContent="File tidak valid."}};rd.readAsText(t.files[0]);t.value=""}
});
document.addEventListener("input",e=>{const id=e.target.id;if(id==="note"||id==="err"||id==="score"){day(cur)[id]=e.target.value;save()}
  else if(id==="sl"||id==="ss"||id==="sr"){const d=day(cur),q=d.sc||(d.sc={l:"",s:"",r:""});q[id[1]]=e.target.value;const a=[q.l,q.s,q.r];if(a.every(x=>x!=="")&&a.every(x=>Number(x)>=31&&Number(x)<=68)){d.score=String(Math.round((Number(q.l)+Number(q.s)+Number(q.r))*10/3));document.getElementById("score").value=d.score}save()}});
document.addEventListener("visibilitychange",tick);
setInterval(tick,1000);
render();
(async()=>{try{
  if(!window.claude)return;
  const u=await claude.use("user"),db=await claude.use("db");
  if(!u||!db)return;
  const id=await u.id();if(!id)return;
  const r=db.collection("data/users/"+id).doc("tracker");
  const snap=await Promise.race([r.get(),new Promise((_,j)=>setTimeout(j,10000))]);
  ref=r;
  if(snap.exists){const o=JSON.parse(snap.data().json);if(o&&o.days){S=Object.assign({goal:2,tm:{run:false,since:0}},o);if(!S.tm)S.tm={run:false,since:0};try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}}
  else save();
}catch(e){}})();
</script>
<script>
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
</html>
